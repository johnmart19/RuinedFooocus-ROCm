<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Last image – RuinedFooocus</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }
      main {
        height: 100%;
      }
      /* Fill the window at any source size while keeping the aspect ratio. */
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
    <script type="module">
      import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@2.7.1/dist/index.min.js";
      const app = await Client.connect(window.location.origin);
      const image = document.getElementById("last_image");
      async function getImage() {
        try {
          const result = await app.predict("/last_image");
          image.src =
            "/gradio_api/file=" +
            encodeURIComponent(result.data[0]).replace(/%2F/gi, "/").replace(/%3A/gi, ":");
          image.hidden = false;
          setTimeout(getImage, 3000);
        } catch {
          // The app may be busy or restarting; try again later.
          setTimeout(getImage, 20000);
        }
      }
      setTimeout(getImage, 1000);
    </script>
  </head>
  <body>
    <main>
      <img
        id="last_image"
        src="/gradio_api/file=ruinedfooocus/ui/assets/logo.png"
        alt="Latest generated image"
        hidden>
    </main>
  </body>
</html>
